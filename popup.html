<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amigo Shift+N</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
      --track: #475569;
    }
    * { box-sizing: border-box; }
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      font-size: 15px;
      margin: 0 0 14px;
      font-weight: 600;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--card);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }
    .row.disabled { opacity: 0.45; }
    .label { font-size: 13px; font-weight: 500; }
    .sub { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.35; }

    .switch { position: relative; display: inline-block; width: 42px; height: 24px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: var(--track); transition: 0.2s; border-radius: 999px;
    }
    .slider::before {
      content: ""; position: absolute; height: 18px; width: 18px;
      left: 3px; bottom: 3px; background: #fff; transition: 0.2s; border-radius: 50%;
    }
    input:checked + .slider { background: var(--accent); }
    input:checked + .slider::before { transform: translateX(18px); }
    input:disabled + .slider { cursor: not-allowed; }

    .modes { display: flex; flex-direction: column; gap: 8px; }
    .mode { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
    .mode input { accent-color: var(--accent); margin-top: 2px; }
  </style>
</head>
<body>
  <h1>Amigo Shift+N Navigator</h1>

  <div class="row" id="row-mode">
    <div class="modes">
      <div class="label">Navigation mode</div>
      <label class="mode">
        <input type="radio" name="nav-version" value="v1" />
        <div>
          <div class="label">V1 &mdash; Step by step</div>
          <div class="sub">Click Next through every page until the quiz.</div>
        </div>
      </label>
      <label class="mode">
        <input type="radio" name="nav-version" value="v2" />
        <div>
          <div class="label">V2 &mdash; Jump to next quiz</div>
          <div class="sub">Skip content pages: open the next incomplete quiz from the activity list and start it.</div>
        </div>
      </label>
    </div>
  </div>

  <div class="row" id="row-enabled">
    <div>
      <div class="label">Shift + N</div>
      <div class="sub">Enable the Shift+N navigation shortcut.</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-enabled" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row" id="row-auto">
    <div>
      <div class="label">Auto Navigate</div>
      <div class="sub">Keep advancing automatically after Shift+N until the quiz attempt page is reached.</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-auto" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row" id="row-fab">
    <div>
      <div class="label">Floating Button</div>
      <div class="sub">Show a "Go to Next Quiz" button at the bottom-right that auto-navigates on click.</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-fab" />
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
